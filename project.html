<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 — 이음유니언 IEU</title>
<meta name="description" content="이음유니언(IEU)이 만든 프로젝트 소개">
<meta name="theme-color" content="#070b18">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="projects/project.css">
<style>
.lead p { margin: 0 0 1em; }
.lead h2 { font-size: 1.25rem; margin: 1.6em 0 .6em; color: var(--text); }
.lead h3 { font-size: 1.05rem; margin: 1.4em 0 .5em; color: var(--text); }
.lead ul { padding-left: 1.2em; }
.lead img { border-radius: 12px; margin: 1em 0; }
.loading { padding: 160px 0; text-align: center; color: var(--sub); }
.p-hero .visit { display: inline-flex; margin-top: 1.4rem; padding: .7rem 1.3rem; border-radius: 999px; background: var(--grad); color: #fff; text-decoration: none; font-weight: 600; font-size: .9rem; }
</style>
</head>
<body>
<nav><div class="wrap">
  <a href="./" class="nav-logo"><img src="assets/ieu-logo-96.png" alt="" width="30" height="28"><b>IEU</b></a>
  <ul class="nav-links"><li><a href="./#about">소개</a></li><li><a href="./#skills">기술</a></li><li><a href="./#projects">프로젝트</a></li><li><a href="./#blog">블로그</a></li></ul>
  <a href="contact.html" class="nav-cta">프로젝트 문의</a>
</div></nav>

<div id="page"><p class="loading">프로젝트를 불러오는 중입니다…</p></div>

<footer><div class="wrap">
  <span class="brand"><img src="assets/ieu-logo-96.png" alt="" width="24" height="22">© 2026 IEU 이음유니언</span>
  <span>connect to the world</span>
</div></footer>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="assets/hub.js"></script>
<script>
(function () {
  var H = window.IEUHub, esc = H.esc, page = document.getElementById('page');
  var slug = new URLSearchParams(location.search).get('slug') || '';
  function notFound(msg) {
    page.innerHTML = '<p class="loading">' + esc(msg) + '<br><br><a href="./#projects" class="back" style="color:var(--blue)">← 프로젝트 목록으로</a></p>';
  }
  function md(s) { return window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(s || '')) : '<p>' + esc(s) + '</p>'; }

  H.projects().then(function (list) {
    var i = list.findIndex(function (p) { return p.slug === slug; });
    if (i < 0) return notFound('프로젝트를 찾을 수 없습니다.');
    var p = list[i], prev = list[(i - 1 + list.length) % list.length], next = list[(i + 1) % list.length];
    document.title = p.name + ' — 이음유니언 IEU';
    var meta = [['분야', p.domain], ['플랫폼', p.platform], ['범위', p.scope], ['상태', p.status]].filter(function (m) { return m[1]; });
    var feats = String(p.features || '').split('\n').map(function (l) { return l.trim(); }).filter(Boolean).map(function (l) { var x = l.split('|'); return [x[0].trim(), (x.slice(1).join('|') || '').trim()]; });
    var no = String(i + 1).padStart(2, '0');
    page.innerHTML =
      '<header class="p-hero"><div class="wrap">' +
        '<a href="./#projects" class="back">← 프로젝트 목록</a>' +
        '<p class="kicker">PROJECT ' + no + (p.category ? ' · ' + esc(p.category) : '') + '</p>' +
        '<h1>' + esc(p.name) + '</h1>' +
        '<p class="summary">' + esc(p.summary || '') + '</p>' +
        (p.url ? '<a class="visit" href="' + esc(p.url) + '" target="_blank" rel="noopener">서비스 바로가기 →</a>' : '') +
        (meta.length ? '<div class="meta">' + meta.map(function (m) { return '<div><small>' + esc(m[0]) + '</small><b>' + esc(m[1]) + '</b></div>'; }).join('') + '</div>' : '<div style="height:2.4rem"></div>') +
        (p.cover ? '<div class="shot"><img src="' + esc(p.cover) + '" alt="' + esc(p.name) + ' 화면">' + (p.concept === 'yes' ? '<span class="concept">UI CONCEPT</span>' : '') + '</div>' : '') +
      '</div></header><main>' +
      (p.body ? '<section><div class="wrap"><p class="kicker" style="color:var(--blue)">OVERVIEW</p><h2 class="h2">프로젝트 개요</h2><div class="lead">' + md(p.body) + '</div>' +
        (p.concept === 'yes' ? '<p class="note">※ 화면 이미지는 프로젝트 소개를 위해 새로 만든 UI 컨셉으로, 실제 납품 화면과 다를 수 있습니다.</p>' : '') + '</div></section>' : '') +
      (feats.length ? '<section><div class="wrap"><p class="kicker" style="color:var(--blue)">FEATURES</p><h2 class="h2">주요 기능</h2><div class="features">' +
        feats.map(function (f, n) { return '<div class="feature"><i>0' + (n + 1) + '</i><h3>' + esc(f[0]) + '</h3><p>' + esc(f[1]) + '</p></div>'; }).join('') + '</div></div></section>' : '') +
      '<section><div class="wrap"><p class="kicker" style="color:var(--blue)">OUR ROLE</p><h2 class="h2">이음유니언이 한 일</h2><div class="steps"><div><b>01 PLAN</b><span>요구사항 · 화면 설계</span></div><div><b>02 DESIGN</b><span>UI/UX 디자인</span></div><div><b>03 BUILD</b><span>개발 · 연동</span></div><div><b>04 LAUNCH</b><span>배포 · 운영</span></div></div></div></section>' +
      ((p.stack || []).length ? '<section><div class="wrap"><p class="kicker" style="color:var(--blue)">STACK</p><h2 class="h2">사용 기술</h2><div class="tags">' + p.stack.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div></div></section>' : '') +
      (list.length > 1 ? '<section><div class="wrap"><div class="pager"><a href="' + esc(H.href(prev)) + '"' + (prev.link === 'url' && prev.url ? ' target="_blank" rel="noopener"' : '') + '><small>← PREV</small><b>' + esc(prev.name) + '</b></a><a href="' + esc(H.href(next)) + '"' + (next.link === 'url' && next.url ? ' target="_blank" rel="noopener"' : '') + '><small>NEXT →</small><b>' + esc(next.name) + '</b></a></div></div></section>' : '') +
      '<section><div class="wrap"><div class="cta"><div><h2>비슷한 서비스를 만들고 싶으신가요?</h2><p>기획 단계의 아이디어도 괜찮습니다.</p></div><a href="contact.html?ref=' + encodeURIComponent(p.slug) + '" class="btn">프로젝트 문의 →</a></div></div></section>' +
      '</main>';
  }).catch(function () { notFound('프로젝트를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'); });
})();
</script>
<script src="assets/cursor.js" data-logo="assets/ieu-logo-96.png"></script>
</body>
</html>
